[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=1.0"
]

[project.scripts]
forge = "backend.app.cli:main"
forge-mcp = "backend.app.mcp_server:main"
forge-antigravity-stop-hook = "backend.app.antigravity_hook:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app" = ["static/**/*"]
