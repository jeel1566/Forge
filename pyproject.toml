[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-local-memory"
version = "0.1.0"
description = "Local-first shared project memory for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Forge contributors" }
]
keywords = ["agents", "codex", "developer-tools", "local-first", "mcp", "memory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=1.0"
]

[project.urls]
Homepage = "https://github.com/jeel1566/Forge"
Repository = "https://github.com/jeel1566/Forge"
Issues = "https://github.com/jeel1566/Forge/issues"

[project.scripts]
forge = "backend.app.cli:main"
forge-mcp = "backend.app.mcp_server:main"
forge-antigravity-stop-hook = "backend.app.antigravity_hook:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"backend.app" = ["static/**/*"]
